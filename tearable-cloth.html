<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>交互织布 - Tearable Cloth</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FAFAFA;
      overflow: hidden;
      touch-action: none; /* 阻止移动端默认的下拉刷新和滚动 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #ui-layer {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      color: #888;
      pointer-events: none;
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 10;
      transition: opacity 1s;
    }
    .highlight {
      color: #D9383A;
      font-weight: bold;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="ui-layer">左键拉扯 | 右键<span class="highlight">激光剪刀</span> ✂️ | 双击<span class="highlight">空气炮</span> 💥 <br><span style="font-size: 11px; opacity: 0.7;">(请打开声音体验沙沙声 🔊)</span></div>

  <script>
    // ====================================================
    // 动态织布 (TEARABLE CLOTH) - Verlet Physics 物理引擎
    // ====================================================

    let particles = [];
    let constraints = [];
    
    // 新增特效数组
    let cutTrails = [];
    let airCannons = [];
    
    // 布料网格尺寸
    const cols = 50; // 布料的列数
    const rows = 40; // 布料的行数
    
    const spacing = 12; // 粒子间距
    const tearDistance = 75; // ⬆️【大幅提高撕裂阈值】：原本是45，现在提升到75，布料变得非常坚韧，很难被轻易撕裂
    
    // 物理参数
    const gravity = 0.08; // ⬇️【大幅降低重力】：原本是0.4，现在变为0.08，让布料有飘浮感，掉落更慢
    const friction = 0.95; // ⬇️【增加空气阻力】：原本是0.98，数值越小阻力越大，让布料运动更平滑粘滞
    const stiffness = 6; // ⬆️【增加硬度/迭代次数】：原本是4，让布料不容易被拉成面条，更像真实的布

    let draggedParticle = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // Web Audio API
    let audioCtx;
    let noiseSource, noiseGain, filter;
    let audioInitialized = false;

    // 初始化沙沙声引擎
    function initAudio() {
      if (!audioInitialized) {
        let AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        // 创建持续的白噪声缓冲
        let bufferSize = 2 * audioCtx.sampleRate; // 2 seconds
        let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = noiseBuffer;
        noiseSource.loop = true;

        // 滤波器：过滤成类似风/摩擦的声音
        filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1000;
        filter.Q.value = 0.5;

        // 增益节点：控制音量大小
        noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0; // 初始静音

        noiseSource.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        noiseSource.start(0);
        audioInitialized = true;
        
        // 隐藏UI
        document.getElementById('ui-layer').style.opacity = '0';
      }
    }

    // 更新音频音量 (根据布料整体的动能)
    function updateAudio(totalKineticEnergy) {
      if (!audioInitialized || !audioCtx) return;
      
      let targetVolume = map(totalKineticEnergy, 0, 500, 0, 0.4);
      targetVolume = constrain(targetVolume, 0, 0.4);
      
      // 平滑过渡音量
      noiseGain.gain.setTargetAtTime(targetVolume, audioCtx.currentTime, 0.1);
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      
      // 彻底禁用网页右键菜单，以便我们使用右键作为剪刀
      document.oncontextmenu = () => false;
      
      generateCloth();
    }

    function generateCloth() {
      particles = [];
      constraints = [];
      
      let startX = width / 2 - (cols * spacing) / 2;
      let startY = 80;

      // 1. 生成所有粒子
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          let p = new Particle(startX + x * spacing, startY + y * spacing);
          
          // 固定顶部的中间点 (原视频的红点)
          if (y === 0 && x === Math.floor(cols / 2)) {
            p.isPinned = true;
            p.isAnchor = true;
          }
          // 额外固定左右两个角，让布料展开更好看 (可选)
          if (y === 0 && (x === 0 || x === cols - 1)) {
            p.isPinned = true;
          }
          
          particles.push(p);
        }
      }

      // 2. 生成弹簧约束 (连线)
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          let i = x + y * cols;
          
          // 横向连接
          if (x < cols - 1) {
            constraints.push(new Constraint(particles[i], particles[i + 1]));
          }
          // 纵向连接
          if (y < rows - 1) {
            constraints.push(new Constraint(particles[i], particles[i + cols]));
          }
        }
      }
    }

    function draw() {
      background(250, 250, 252); // 干净的灰白背景

      let totalMovement = 0;

      // 物理迭代
      for (let p of particles) {
        let movement = p.update();
        totalMovement += movement; // 收集布料的总体运动量，用于音效
      }

      // 多次迭代约束，使布料更坚韧
      for (let i = 0; i < stiffness; i++) {
        for (let j = constraints.length - 1; j >= 0; j--) {
          let c = constraints[j];
          let isIntact = c.resolve();
          // 如果被撕裂了，从数组中移除该约束
          if (!isIntact) {
            constraints.splice(j, 1);
          }
        }
      }

      // 根据运动量调整沙沙声
      updateAudio(totalMovement);

      // 绘制约束线 (纤维)
      for (let c of constraints) {
        c.display();
      }

      // 绘制粒子 (原点)
      for (let p of particles) {
        p.display();
      }

      // 绘制激光切割轨迹
      for (let i = cutTrails.length - 1; i >= 0; i--) {
        let t = cutTrails[i];
        stroke(217, 56, 58, t.life);
        strokeWeight(4);
        line(t.x1, t.y1, t.x2, t.y2);
        t.life -= 20;
        if (t.life <= 0) cutTrails.splice(i, 1);
      }

      // 绘制空气炮冲击波
      for (let i = airCannons.length - 1; i >= 0; i--) {
        let c = airCannons[i];
        noFill();
        stroke(150, 180, 220, c.life);
        strokeWeight(map(c.life, 0, 255, 1, 15));
        circle(c.x, c.y, c.radius);
        c.radius += 25;
        c.life -= 15;
        if (c.life <= 0) airCannons.splice(i, 1);
      }
    }

    function mousePressed() {
      initAudio();
      
      // 只有左键才抓取布料
      if (mouseButton !== LEFT) return;
      
      // 寻找距离鼠标最近的粒子
      let closest = null;
      let minDist = 30; // 抓取判定半径

      for (let p of particles) {
        let d = dist(mouseX, mouseY, p.x, p.y);
        if (d < minDist) {
          closest = p;
          minDist = d;
        }
      }

      if (closest) {
        draggedParticle = closest;
        draggedParticle.isDragged = true;
        dragOffsetX = draggedParticle.x - mouseX;
        dragOffsetY = draggedParticle.y - mouseY;
      }
    }

    // 辅助数学函数：线段相交检测 (用于激光切割)
    function lineIntersects(x1, y1, x2, y2, x3, y3, x4, y4) {
      let det = (x2 - x1) * (y4 - y3) - (x4 - x3) * (y2 - y1);
      if (det === 0) return false; // 平行
      let lambda = ((y4 - y3) * (x4 - x1) + (x3 - x4) * (y4 - y1)) / det;
      let gamma = ((y1 - y2) * (x4 - x1) + (x2 - x1) * (y4 - y1)) / det;
      return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
    }

    function mouseDragged() {
      initAudio();
      
      if (mouseButton === LEFT && draggedParticle) {
        // 左键：拖拽布料
        draggedParticle.x = mouseX + dragOffsetX;
        draggedParticle.y = mouseY + dragOffsetY;
      } 
      else if (mouseButton === RIGHT || mouseButton === CENTER) {
        // 右键：激光剪刀
        let cutCount = 0;
        for (let i = constraints.length - 1; i >= 0; i--) {
          let c = constraints[i];
          if (lineIntersects(pmouseX, pmouseY, mouseX, mouseY, c.p1.x, c.p1.y, c.p2.x, c.p2.y)) {
            constraints.splice(i, 1); // 瞬间切断
            cutCount++;
          }
        }
        if (cutCount > 0 || frameCount % 3 === 0) {
          // 添加激光视觉残留
          cutTrails.push({x1: pmouseX, y1: pmouseY, x2: mouseX, y2: mouseY, life: 255});
        }
      }
    }

    function doubleClicked() {
      initAudio();
      
      // 添加空气炮视觉冲击波
      airCannons.push({x: mouseX, y: mouseY, radius: 0, life: 255});
      
      // 1. 物理炸飞：给范围内的粒子注入极大动能
      for (let p of particles) {
        let d = dist(mouseX, mouseY, p.x, p.y);
        if (d < 180) {
          let angle = atan2(p.y - mouseY, p.x - mouseX);
          let force = map(d, 0, 180, 50, 0); // 空气炮威力
          
          // 在 Verlet 积分中，修改 oldX 会产生强烈的速度
          p.oldX -= cos(angle) * force;
          p.oldY -= sin(angle) * force;
        }
      }
      
      // 2. 中心撕裂：如果空气炮在布料正中心爆炸，直接炸出一个洞
      for (let i = constraints.length - 1; i >= 0; i--) {
        let c = constraints[i];
        let d1 = dist(mouseX, mouseY, c.p1.x, c.p1.y);
        let d2 = dist(mouseX, mouseY, c.p2.x, c.p2.y);
        if (d1 < 45 && d2 < 45) {
          constraints.splice(i, 1);
        }
      }
    }

    function mouseReleased() {
      if (draggedParticle) {
        draggedParticle.isDragged = false;
        draggedParticle = null;
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.oldX = x;
        this.oldY = y;
        this.isPinned = false;
        this.isAnchor = false; // 特殊的固定点 (如顶部的红点)
        this.isDragged = false;
        this.mass = 1;
      }

      update() {
        if (this.isPinned || this.isDragged) return 0;

        let vx = (this.x - this.oldX) * friction;
        let vy = (this.y - this.oldY) * friction;

        this.oldX = this.x;
        this.oldY = this.y;

        this.x += vx;
        this.y += vy + gravity;

        return abs(vx) + abs(vy);
      }

      display() {
        noStroke();
        if (this.isAnchor || this.isDragged) {
          // 被抓取或锚定的点显示为红色
          fill(217, 56, 58);
          circle(this.x, this.y, 6);
        } else {
          // 普通节点为黄绿色
          fill(141, 170, 62);
          circle(this.x, this.y, 4);
        }
      }
    }

    class Constraint {
      constructor(p1, p2) {
        this.p1 = p1;
        this.p2 = p2;
        this.restLength = spacing;
        this.currentTension = 0;
      }

      resolve() {
        let dx = this.p2.x - this.p1.x;
        let dy = this.p2.y - this.p1.y;
        let d = Math.sqrt(dx * dx + dy * dy);
        
        // 防止除以0
        if (d === 0) return true;

        // 撕裂逻辑 (如果两点距离被拉扯到原始距离的N倍以上)
        if (d > tearDistance) {
          return false; // 返回 false 意味着此约束断裂
        }

        let diff = (this.restLength - d) / d;
        this.currentTension = abs(diff); // 记录张力大小用于颜色渲染

        let offsetX = dx * diff * 0.5;
        let offsetY = dy * diff * 0.5;

        if (!this.p1.isPinned && !this.p1.isDragged) {
          this.p1.x -= offsetX;
          this.p1.y -= offsetY;
        }
        if (!this.p2.isPinned && !this.p2.isDragged) {
          this.p2.x += offsetX;
          this.p2.y += offsetY;
        }

        return true; // 保持完整
      }

      display() {
        // 根据张力计算颜色
        // 放松时是浅绿色，拉紧时偏黄，快断裂时偏红
        let t = constrain(map(this.currentTension, 0, 0.5, 0, 1), 0, 1);
        
        // Lerp Color 手动计算 (为了性能不调用p5的lerpColor)
        // From: rgba(141, 170, 62, 0.5) -> To: rgba(217, 56, 58, 0.8)
        let r = 141 + (217 - 141) * t;
        let g = 170 + (56 - 170) * t;
        let b = 62 + (58 - 62) * t;
        let a = 100 + (200 - 100) * t;

        stroke(r, g, b, a);
        strokeWeight(1.2);
        line(this.p1.x, this.p1.y, this.p2.x, this.p2.y);
      }
    }
  </script>
</body>
</html>
