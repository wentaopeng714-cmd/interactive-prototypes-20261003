<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>万花筒纸雕星阵 - Kaleidoscope Paper Stars</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111215;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    canvas {
      display: block;
      margin: 0 auto;
      touch-action: none;
    }
    /* 顶部悬浮毛玻璃中控台 */
    #hud {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(22, 24, 30, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      color: #eaecef;
      font-size: 13px;
      transition: all 0.3s ease;
    }
    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      outline: none;
    }
    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }
    .hud-btn:active {
      transform: scale(0.96);
    }
    .hud-select {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f0f2f5;
      padding: 5px 12px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      font-size: 12px;
    }
    .hud-select option {
      background: #181a20;
      color: #fff;
    }
    /* 底部温馨交互提示 */
    #tip {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.42);
      font-size: 12px;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 90;
      white-space: nowrap;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- 顶部交互 HUD -->
  <div id="hud">
    <button class="hud-btn" id="regenBtn">✨ 重新排布</button>
    <button class="hud-btn" id="paletteBtn">🎨 换调色板</button>
    <div style="height:14px; width:1px; background:rgba(255,255,255,0.18);"></div>
    <select id="styleSelect" class="hud-select">
      <option value="paper">📜 浮雕和纸 (Paper Relief)</option>
      <option value="glass">💎 彩色琉璃 (Stained Glass)</option>
      <option value="neon">🌌 赛博星云 (Neon Nebula)</option>
    </select>
    <button class="hud-btn" id="audioBtn">🔊 晶体音: 开</button>
  </div>

  <div id="tip">滑动拨弄星辰 | 点击激发万花筒冲击波 | 空格快速重构</div>

  <script>
    let cs;
    let stars = [];
    let sparkles = [];
    let ripples = [];
    let proceduralTexture;
    let grainTexture;
    let baseNoiseSeed;

    let visualStyle = "paper"; // "paper" | "glass" | "neon"
    let soundEnabled = true;

    // 精选设计调色板
    const palettes = [
      ["#3c4cad", "#5FB49C", "#e8a49c", "#f3d17c", "#2b2d42"],
      ["#1c3560", "#ff6343", "#f2efdb", "#fea985", "#386890"],
      ["#e0d7c5", "#488a50", "#b59a55", "#bf5513", "#3b6fb6", "#7c4552"],
      ["#ffbe0b", "#fb5607", "#ff006e", "#8338ec", "#3a86ff"],
      ["#2B2B2B", "#91B3E1", "#2F5FB3", "#3D4B89", "#AE99E8", "#DBE2EC"],
      ["#A8C25D", "#5B7243", "#FFA088", "#FFFB42", "#a9cff0", "#2D6EA6"],
      ["#F9F9F1", "#191A18", "#E15521", "#3391CF", "#E4901C", "#F5B2B1", "#009472"]
    ];
    let currentPalette = [];

    // Web Audio 空灵晶体钟琴音阶合成器
    let audioCtx = null;
    const crystalPentatonic = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCrystalChime(freqIndex, intensity = 0.25) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const subOsc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        const baseFreq = crystalPentatonic[Math.abs(freqIndex) % crystalPentatonic.length];
        osc.type = 'sine';
        osc.frequency.setValueAtTime(baseFreq, now);

        // 谐波叠加产生水晶质感
        subOsc.type = 'triangle';
        subOsc.frequency.setValueAtTime(baseFreq * 2.02, now);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(baseFreq * 1.5, now);
        filter.Q.setValueAtTime(3.0, now);

        gain.gain.setValueAtTime(intensity * 0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);

        osc.connect(filter);
        subOsc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        subOsc.start(now);
        osc.stop(now + 0.68);
        subOsc.stop(now + 0.68);
      } catch (e) {}
    }

    function setup() {
      cs = min(windowHeight, windowWidth);
      createCanvas(cs, cs);
      rectMode(CENTER);
      angleMode(DEGREES);

      baseNoiseSeed = floor(random(100000));
      currentPalette = [...random(palettes)];

      generateProceduralTexture();
      buildGrainOverlay();
      rebuildStarLattice();
      bindEvents();
    }

    // 动态过程化生成液态流金/大理石底纹，彻底替代容易 404 崩溃的 img.jpg
    function generateProceduralTexture() {
      proceduralTexture = createGraphics(800, 800);
      proceduralTexture.colorMode(RGB, 255);
      proceduralTexture.noStroke();

      // 多层流动渐变环
      for (let r = 800; r > 0; r -= 18) {
        let col = color(random(currentPalette));
        col.setAlpha(190);
        proceduralTexture.fill(col);
        proceduralTexture.circle(400 + random(-80, 80), 400 + random(-80, 80), r);
      }

      // 流动涡流线
      proceduralTexture.strokeWeight(12);
      for (let i = 0; i < 40; i++) {
        proceduralTexture.noFill();
        let c = color(random(currentPalette));
        c.setAlpha(120);
        proceduralTexture.stroke(c);
        let cx = random(800), cy = random(800);
        proceduralTexture.arc(cx, cy, random(200, 500), random(200, 500), random(0, 180), random(180, 360));
      }
    }

    // 高端纸本质感噪点图层
    function buildGrainOverlay() {
      grainTexture = createGraphics(width, height);
      grainTexture.noStroke();
      let count = floor((width * height) * 0.04);
      for (let i = 0; i < count; i++) {
        let gx = grainTexture.random(width);
        let gy = grainTexture.random(height);
        let alpha = random(15, 38);
        grainTexture.fill(random() > 0.5 ? 255 : 0, alpha);
        grainTexture.rect(gx, gy, 1.2, 1.2);
      }
    }

    class PaperStar {
      constructor(x, y, radius) {
        this.x = x;
        this.y = y;
        this.baseRadius = radius;
        this.currentRadius = radius;
        this.targetRadius = radius;
        this.radiusVel = 0;

        // 几何形态参数
        this.verticesNum = floor(random(4, 11)); // 星角数目
        this.depth = random(0.35, 0.85); // 凹凸收敛深度
        this.angleOffset = random(360);
        this.rotSpeed = random([-0.6, -0.3, 0.3, 0.6]);
        this.extraRotVel = 0;

        // 颜色与纹理
        this.fillColor = color(random(currentPalette));
        this.strokeColor = color(random(currentPalette));
        this.cropX = random(0, 800 - radius * 2);
        this.cropY = random(0, 800 - radius * 2);

        // 动态位移与倾斜
        this.offsetX = 0;
        this.offsetY = 0;
        this.targetOffX = 0;
        this.targetOffY = 0;
        this.toneIndex = floor(random(crystalPentatonic.length));
      }

      update(mx, my, isHoverActive) {
        // 1. 鼠标悬停磁性引力与形变
        let d = dist(mx, my, this.x + this.offsetX, this.y + this.offsetY);
        let magnetRadius = this.baseRadius * 1.8;

        if (isHoverActive && d < magnetRadius) {
          let factor = (1 - d / magnetRadius);
          this.targetRadius = this.baseRadius * (1.0 + factor * 0.35);
          let angle = atan2(this.y - my, this.x - mx);
          this.targetOffX = cos(angle) * factor * 14;
          this.targetOffY = sin(angle) * factor * 14;
          this.extraRotVel += factor * 1.4;
        } else {
          this.targetRadius = this.baseRadius;
          this.targetOffX = 0;
          this.targetOffY = 0;
        }

        // 2. 涟漪波动力学受压
        for (let rip of ripples) {
          let ripDist = dist(rip.x, rip.y, this.x, this.y);
          let diff = abs(ripDist - rip.radius);
          if (diff < rip.bandWidth) {
            let wavePower = (1 - diff / rip.bandWidth) * rip.strength;
            this.targetRadius += wavePower * 18;
            this.extraRotVel += wavePower * 3.5;
            let wAng = atan2(this.y - rip.y, this.x - rip.x);
            this.targetOffX += cos(wAng) * wavePower * 20;
            this.targetOffY += sin(wAng) * wavePower * 20;
          }
        }

        // 3. 弹簧阻尼力学平滑过渡
        let springK = 0.18;
        let damping = 0.72;
        let force = (this.targetRadius - this.currentRadius) * springK;
        this.radiusVel = (this.radiusVel + force) * damping;
        this.currentRadius += this.radiusVel;

        this.offsetX += (this.targetOffX - this.offsetX) * 0.18;
        this.offsetY += (this.targetOffY - this.offsetY) * 0.18;

        // 4. 自转衰减
        this.extraRotVel *= 0.94;
        this.angleOffset += this.rotSpeed + this.extraRotVel;
      }

      display() {
        push();
        translate(this.x + this.offsetX, this.y + this.offsetY);
        rotate(this.angleOffset);

        let r = max(4, this.currentRadius);
        let innerR = r * this.depth;

        // 针对不同模式配置高精度立体阴影
        if (visualStyle === "paper") {
          drawingContext.shadowColor = "rgba(0, 0, 0, 0.35)";
          drawingContext.shadowBlur = 14;
          drawingContext.shadowOffsetY = 7;
          drawingContext.shadowOffsetX = 2;
        } else if (visualStyle === "neon") {
          drawingContext.shadowColor = this.fillColor.toString('#hex');
          drawingContext.shadowBlur = 22;
        } else {
          drawingContext.shadowColor = "rgba(0, 0, 0, 0.15)";
          drawingContext.shadowBlur = 6;
        }

        // 底色基底星形
        noStroke();
        fill(this.fillColor);
        this.drawStarShape(0, 0, r, innerR, this.verticesNum);

        // 局部剪裁并叠加液态流金底纹 (精美浮雕裁剪)
        push();
        this.drawStarShape(0, 0, r, innerR, this.verticesNum);
        drawingContext.clip();

        if (visualStyle === "paper") {
          blendMode(OVERLAY);
          image(proceduralTexture, -r, -r, r * 2, r * 2, this.cropX, this.cropY, r * 2, r * 2);
        } else if (visualStyle === "glass") {
          blendMode(HARD_LIGHT);
          image(proceduralTexture, -r, -r, r * 2, r * 2, this.cropX, this.cropY, r * 2, r * 2);
        } else {
          blendMode(ADD);
          image(proceduralTexture, -r, -r, r * 2, r * 2, this.cropX, this.cropY, r * 2, r * 2);
        }
        pop();

        // 烫金精细描边轮廓
        drawingContext.shadowBlur = 0;
        strokeWeight(visualStyle === "neon" ? 2.5 : 1.4);
        stroke(visualStyle === "paper" ? "rgba(255,245,225,0.7)" : this.strokeColor);
        noFill();
        this.drawStarShape(0, 0, r, innerR, this.verticesNum);

        pop();
      }

      drawStarShape(cx, cy, outerR, innerR, numPoints) {
        let step = 360 / numPoints;
        beginShape();
        for (let a = 0; a < 360; a += step) {
          let ox = cx + cos(a) * outerR;
          let oy = cy + sin(a) * outerR;
          vertex(ox, oy);
          let ix = cx + cos(a + step * 0.5) * innerR;
          let iy = cy + sin(a + step * 0.5) * innerR;
          vertex(ix, iy);
        }
        endShape(CLOSE);
      }
    }

    function rebuildStarLattice() {
      stars = [];
      let points = [];
      let totalAttempts = 900;

      for (let i = 0; i < totalAttempts; i++) {
        let candidateR = random(18, width * 0.16);
        let cx = random(candidateR, width - candidateR);
        let cy = random(candidateR, height - candidateR);

        let canAdd = true;
        for (let j = 0; j < points.length; j++) {
          let p = points[j];
          // 紧密装填算法
          if (dist(cx, cy, p.x, p.y) < (candidateR + p.z) * 0.72) {
            canAdd = false;
            break;
          }
        }
        if (canAdd) {
          points.push(createVector(cx, cy, candidateR));
          stars.push(new PaperStar(cx, cy, candidateR));
        }
      }
      playCrystalChime(4, 0.4);
    }

    function triggerShockwave(x, y) {
      initAudio();
      ripples.push({
        x: x,
        y: y,
        radius: 8,
        maxRadius: max(width, height) * 0.9,
        speed: 18,
        bandWidth: 60,
        strength: 1.0
      });

      // 迸发星光粒子
      for (let i = 0; i < 22; i++) {
        let ang = random(360);
        let spd = random(2.5, 7.5);
        sparkles.push({
          x: x,
          y: y,
          vx: cos(ang) * spd,
          vy: sin(ang) * spd,
          size: random(3, 7),
          col: color(random(currentPalette)),
          life: 255
        });
      }
      playCrystalChime(floor(random(crystalPentatonic.length)), 0.45);
    }

    let lastHoveredStar = null;

    function draw() {
      // 背景色调配合当前模式
      if (visualStyle === "paper") {
        background("#f5f1e8");
      } else if (visualStyle === "glass") {
        background("#141824");
      } else {
        background("#090a0f");
      }

      let isMouseInCanvas = (mouseX >= 0 && mouseX <= width && mouseY >= 0 && mouseY <= height);

      // 检测是否有新悬停星徽触发晶体铃声
      let currentHover = null;
      for (let star of stars) {
        if (dist(mouseX, mouseY, star.x, star.y) < star.baseRadius) {
          currentHover = star;
          break;
        }
      }
      if (currentHover && currentHover !== lastHoveredStar) {
        playCrystalChime(currentHover.toneIndex, 0.18);
        lastHoveredStar = currentHover;
      }

      // 1. 更新并绘制所有星徽
      for (let s of stars) {
        s.update(mouseX, mouseY, isMouseInCanvas);
        s.display();
      }

      // 2. 更新与渲染万花筒震荡波
      noFill();
      for (let i = ripples.length - 1; i >= 0; i--) {
        let rip = ripples[i];
        rip.radius += rip.speed;
        rip.strength *= 0.95;

        stroke(visualStyle === "paper" ? 180 : 255, rip.strength * 160);
        strokeWeight(1.8);
        circle(rip.x, rip.y, rip.radius * 2);

        if (rip.radius > rip.maxRadius || rip.strength < 0.02) {
          ripples.splice(i, 1);
        }
      }

      // 3. 渲染金色溅射火星
      for (let i = sparkles.length - 1; i >= 0; i--) {
        let p = sparkles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life -= 8;

        noStroke();
        p.col.setAlpha(p.life);
        fill(p.col);
        circle(p.x, p.y, p.size * (p.life / 255));

        if (p.life <= 0) sparkles.splice(i, 1);
      }

      // 4. 纸质胶片噪点蒙版层
      if (visualStyle === "paper" && grainTexture) {
        image(grainTexture, 0, 0);
      }
    }

    function mousePressed() {
      initAudio();
      // 避免点到控制栏误触发
      if (mouseY < 75 && mouseX > width / 2 - 240 && mouseX < width / 2 + 240) return;
      triggerShockwave(mouseX, mouseY);
    }

    function mouseDragged() {
      initAudio();
      if (frameCount % 8 === 0) {
        let d = dist(mouseX, mouseY, pmouseX, pmouseY);
        if (d > 10) {
          triggerShockwave(mouseX, mouseY);
        }
      }
    }

    function keyPressed() {
      if (key === ' ') {
        initAudio();
        rebuildStarLattice();
      }
    }

    function windowResized() {
      cs = min(windowHeight, windowWidth);
      resizeCanvas(cs, cs);
      buildGrainOverlay();
      rebuildStarLattice();
    }

    function bindEvents() {
      document.getElementById('regenBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        rebuildStarLattice();
      });

      document.getElementById('paletteBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        currentPalette = [...random(palettes)];
        generateProceduralTexture();
        for (let s of stars) {
          s.fillColor = color(random(currentPalette));
          s.strokeColor = color(random(currentPalette));
        }
        playCrystalChime(5, 0.4);
      });

      document.getElementById('styleSelect').addEventListener('change', (e) => {
        visualStyle = e.target.value;
      });

      const audioBtn = document.getElementById('audioBtn');
      audioBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        soundEnabled = !soundEnabled;
        audioBtn.textContent = soundEnabled ? '🔊 晶体音: 开' : '🔇 晶体音: 关';
      });
    }
  </script>
</body>
</html>
