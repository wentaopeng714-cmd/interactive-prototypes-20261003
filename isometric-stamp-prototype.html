<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>等距透视印章交互原型 - ISOMETRIC STAMP PROTOTYPE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #d8b0b6; /* 严格对齐原图纯正暖粉藕色背景 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 主视口居中舞台：保持 4:3 黄金展示比例，全屏自适应 */
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 133.33vh;
      max-height: 75vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* 悬浮印章平滑缓动物理动画 */
    #stamp-rig {
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.2, 0.9, 0.3, 1.15);
      will-change: transform;
    }

    /* 纸面常驻印记图层 */
    #active-imprint {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease-out;
    }

    #active-imprint.visible {
      opacity: 0.88;
    }

    /* 飞出纸张的平滑漂移动画 */
    .flying-sheet {
      pointer-events: none;
      will-change: transform, opacity;
      animation: paperFloatAway 0.85s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes paperFloatAway {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0.96;
      }
      25% {
        transform: translate3d(45px, -35px, 0) rotate(2.5deg);
        opacity: 0.94;
      }
      65% {
        transform: translate3d(240px, -50px, 0) rotate(7deg);
        opacity: 0.85;
      }
      100% {
        transform: translate3d(520px, -20px, 0) rotate(14deg);
        opacity: 0;
      }
    }

    /* 左下角极简信息图说明指示牌 */
    .prototype-hud {
      position: absolute;
      bottom: 24px;
      left: 28px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 14px;
      padding: 12px 18px;
      color: #5c3840;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      pointer-events: none;
      box-shadow: 0 4px 24px rgba(90, 40, 50, 0.1);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prototype-hud .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: #7b4b54;
    }

    .prototype-hud .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7ed4bc;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .prototype-hud .status-dot.active {
      background: #dc484f;
      transform: scale(1.25);
    }

    .counter-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      color: #dc484f;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <svg id="scene" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
      <!-- 1. 淡粉纯色底色 (精确还原 #d8b0b6) -->

        <!-- 纸叠顶面 (纯净无瑕白纸菱形，中心点精确位于 (450, 315)) -->
        <polygon id="paper-top" points="484.6,185 224.8,335 415.4,445 675.2,295" fill="#fbfcfd" />

        <!-- 纸张表面常驻印记槽 (严格贴合纸面 30° 空间仿射矩阵) -->
        <g id="active-imprint" transform="translate(450, 315) matrix(0.866025, 0.5, -0.866025, 0.5, 0, 0)">
          <g id="active-imprint-inner"></g>
        </g>
      </g>

      <!-- 动态飞走纸张容器 (放置正在飞向远方的带印纸张) -->

      <!-- ========================================================
           5. 悬浮橡皮木柄印章 (Floating Rubber Stamp Rig)
           静止悬停于正上方；下落 140px 时橡皮面精准触底吻合纸面
           ======================================================== -->
      <g id="stamp-rig" transform="translate(0, 0)">
        <!-- 压紧接触阴影：平时悬空完全隐藏，触纸瞬间显现 -->

        <!-- A. 印章底部深炭黑橡皮层 (Rubber Layer)
             底面菱形在悬停态位于 (450, 175)，下落 140px 后正好与白纸顶面 (450, 315) 彻底贴合！
        -->
        <g id="stamp-rubber">

        <!-- B. 木质基座厚块 (Wooden Base Block) -->

          <polygon points="354.7,155 450,210 450,180 354.7,125" fill="#cead8b" />

        <!-- C. 蘑菇型深灰圆润木手柄 (Turned Wooden Handle) -->
        <g id="stamp-handle">
          <!-- 贴在木座顶面的圆弧底座裙边 -->
          <ellipse cx="450" cy="138" rx="34" ry="19.5" fill="#585353" />
          <ellipse cx="450" cy="136.5" rx="32" ry="18" fill="#656060" />

          <!-- 下段喇叭状收缩弧颈 -->
          <path d="M 422 133 
                   C 422 105, 432 85, 436 65 
                   L 464 65 
                   C 468 85, 478 105, 478 133 
                   Z" fill="#696464" />

          <!-- 上段圆柱过渡连接段 -->

        <!-- 扩展全印章透明感应热区 (确保鼠标 hover / click 极其灵敏) -->

    <!-- 原型状态与交互说明 HUD -->

  </div>

  <script>
    /* ==========================================================
       轻量级拟真音效合成器 (纯原生 Web Audio，无外部文件)
       ========================================================== */
    class StampAudio {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      // 1. 印章完全盖下：沉稳结实的纸面木质撞击声 "Thud-Thump"
      playStampDown() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // 低频木质顿感
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(175, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.11);

        gain.gain.setValueAtTime(0.42, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);

        // 纸张微摩擦白噪
        const bufferSize = this.ctx.sampleRate * 0.04;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(850, now);
        filter.Q.setValueAtTime(2.2, now);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.14, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        whiteNoise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        whiteNoise.start(now);
      }

      // 2. 印章抬起复位：清脆轻巧的橡皮回弹声
      playStampUp() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(560, now + 0.08);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      // 3. 纸张飞走：清脆柔和的风声呼啸 "Fwoosh~"
      playPaperWhoosh() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const dur = 0.35;
        const bufferSize = Math.floor(this.ctx.sampleRate * dur);
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(450, now + dur);
        filter.Q.setValueAtTime(1.8, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        whiteNoise.start(now);
      }
    }

    const sound = new StampAudio();

    /* ==========================================================
       丰富的 8 款高品质矢量印章印记图案库
       ========================================================== */
    const STAMP_DESIGNS = [
      // 0: APPROVED 官方批准双框章
      `

      `

      `

        <path d="M -22 10 Q 0 35 22 10" fill="none" stroke="#dc484f" stroke-width="5" stroke-linecap="round" />
        <text x="0" y="38" text-anchor="middle" fill="#dc484f" font-size="9" font-weight="900" font-family="sans-serif" letter-spacing="2">HAVE A NICE DAY</text>
      `,
      // 4: VERIFIED 权威齿轮圆标合格印
      `
        <circle cx="0" cy="0" r="50" fill="none" stroke="#dc484f" stroke-width="5" />
        <circle cx="0" cy="0" r="42" fill="none" stroke="#dc484f" stroke-width="1.8" />
        <path d="M -20 0 L -6 14 L 22 -14" fill="none" stroke="#dc484f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <text x="0" y="32" text-anchor="middle" fill="#dc484f" font-size="12" font-weight="900" font-family="sans-serif" letter-spacing="3">VERIFIED</text>
      `,
      // 5: WITH LOVE 甜蜜心形章
      `
        <rect x="-60" y="-36" width="120" height="72" rx="14" ry="14" fill="none" stroke="#dc484f" stroke-width="4.5" />
        <path d="M 0 -6 C 0 -16, -16 -22, -20 -10 C -24 2, 0 18, 0 18 C 0 18, 24 2, 20 -10 C 16 -22, 0 -16, 0 -6 Z" fill="#dc484f" />
        <text x="0" y="28" text-anchor="middle" fill="#dc484f" font-size="12" font-weight="900" font-family="sans-serif" letter-spacing="2">WITH LOVE</text>
      `,
      // 6: COFFEE BREAK 休闲咖啡章
      `
        <circle cx="0" cy="0" r="48" fill="none" stroke="#dc484f" stroke-width="4.5" />
        <path d="M -16 -4 L 16 -4 L 12 18 C 12 24, -12 24, -12 18 Z" fill="none" stroke="#dc484f" stroke-width="4" stroke-linejoin="round" />
        <path d="M 16 0 Q 25 2 14 12" fill="none" stroke="#dc484f" stroke-width="3" />
        <path d="M -6 -10 Q -2 -16 -6 -22" fill="none" stroke="#dc484f" stroke-width="2.5" stroke-linecap="round" />

        <text x="0" y="38" text-anchor="middle" fill="#dc484f" font-size="10" font-weight="900" font-family="sans-serif" letter-spacing="1.5">BREAK TIME</text>
      `,
      // 7: 经典付讫章 (PAID)
      `
        <rect x="-56" y="-30" width="112" height="60" rx="8" ry="8" fill="none" stroke="#dc484f" stroke-width="5" />
        <text x="0" y="10" text-anchor="middle" fill="#dc484f" font-size="30" font-weight="900" font-family="sans-serif" letter-spacing="4">PAID</text>
        <line x1="-42" y1="20" x2="42" y2="20" stroke="#dc484f" stroke-width="2" />

    /* ==========================================================
       交互状态机：按压盖印 -> 抬起时图标依然在 -> 纸张飞走流转
       ========================================================== */
    const stampRig = document.getElementById('stamp-rig');
    const stampShadow = document.getElementById('stamp-contact-shadow');
    const activeImprint = document.getElementById('active-imprint');
    const activeImprintInner = document.getElementById('active-imprint-inner');
    const flyingPapersContainer = document.getElementById('flying-papers-container');
    const paperStack = document.getElementById('paper-stack');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const counterVal = document.getElementById('counter-val');

    let isBusy = false;       // 防止高频重叠触发连击打乱动作流
    let isHovered = false;    // 是否处于悬停预按压态
    let currentPatternIdx = -1;
    let processedCount = 0;   // 已盖印流转的文件计数器

    // 随机获取下一个不重复的图案
    function getNextRandomPattern() {
      let nextIdx;
      do {
        nextIdx = Math.floor(Math.random() * STAMP_DESIGNS.length);
      } while (nextIdx === currentPatternIdx);
      currentPatternIdx = nextIdx;
      const subtleDeg = (Math.random() - 0.5) * 5;
      return {
        svg: STAMP_DESIGNS[nextIdx],
        rot: subtleDeg
      };
    }

    // 1. 鼠标悬停 (Hover Enter) -> 下沉 25px 预按压
    stampRig.addEventListener('pointerenter', () => {
      isHovered = true;
      if (!isBusy) {
        stampRig.style.transform = 'translate3d(0, 25px, 0)';
        statusText.textContent = 'READY TO STAMP // CLICK TO PRESS';
      }
    });

    // 2. 鼠标离开 (Hover Leave) -> 复位
    stampRig.addEventListener('pointerleave', () => {
      isHovered = false;
      if (!isBusy) {
        stampRig.style.transform = 'translate3d(0, 0px, 0)';
        statusText.textContent = 'CLICK TO STAMP & FLY';
      }
    });

    /**
     * 核心动效：创建并起飞一张带有指定印章印记的白纸
     */
    function launchFlyingPaper(patternData) {
      // 播放清脆的纸张飞掠风声
      sound.playPaperWhoosh();

      // 构建一个包含白纸顶面和相同图案的 SVG 独立克隆节点
      const flyingGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      flyingGroup.setAttribute('class', 'flying-sheet');

      // 柔和的纸张阴影
      const shadowPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      shadowPoly.setAttribute('points', '484.6,185 224.8,335 415.4,445 675.2,295');
      shadowPoly.setAttribute('fill', '#b89aa2');
      shadowPoly.setAttribute('opacity', '0.4');
      shadowPoly.setAttribute('transform', 'translate(8, 14)');

      // 白纸顶面
      const paperPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      paperPoly.setAttribute('points', '484.6,185 224.8,335 415.4,445 675.2,295');
      paperPoly.setAttribute('fill', '#fbfcfd');

      // 印记图层
      const imprintG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      imprintG.setAttribute('transform', `translate(450, 315) matrix(0.866025, 0.5, -0.866025, 0.5, 0, 0) rotate(${patternData.rot})`);
      imprintG.setAttribute('opacity', '0.88');
      imprintG.innerHTML = patternData.svg;

      flyingGroup.appendChild(shadowPoly);
      flyingGroup.appendChild(paperPoly);
      flyingGroup.appendChild(imprintG);
      flyingPapersContainer.appendChild(flyingGroup);

      // 动画完成后自动从 DOM 销毁清理
      setTimeout(() => {
        if (flyingGroup.parentNode) {
          flyingGroup.parentNode.removeChild(flyingGroup);
        }
      }, 900);
    }

    /**
     * 点击触发完整盖印流转：
     * 1. 印章稳实盖下 (140px)，落地发声；
     * 2. 印章弹起复位，抬上来时【印记稳稳留在纸上】！
     * 3. 紧接着，盖好章的这页纸【带着图标优雅滑翔飞走】，下方纸堆露出全新的空白页，准备下一次盖印！
     */
    function triggerStampCycle(e) {
      if (e) e.stopPropagation();
      if (isBusy) return;
      isBusy = true;

      const patternData = getNextRandomPattern();

      // ---- 阶段 1: 印章完全盖下压实 (Down: 140px) ----
      sound.playStampDown();
      statusDot.classList.add('active');
      statusText.textContent = 'STAMPING DOWN...';

      stampRig.style.transition = 'transform 0.12s cubic-bezier(0.2, 0.8, 0.35, 1.1)';
      stampRig.style.transform = 'translate3d(0, 140px, 0)';
      stampShadow.setAttribute('opacity', '0.45');

      // 印泥显现于当前纸上
      activeImprintInner.innerHTML = patternData.svg;
      activeImprintInner.setAttribute('transform', `rotate(${patternData.rot})`);
      activeImprint.classList.add('visible');

      // ---- 阶段 2: 印章迅速弹起抬上 (Lift Up: 图标依然清晰保留在纸上!) ----
      setTimeout(() => {
        sound.playStampUp();
        stampRig.style.transition = 'transform 0.24s cubic-bezier(0.34, 1.45, 0.64, 1)';
        stampRig.style.transform = isHovered ? 'translate3d(0, 25px, 0)' : 'translate3d(0, 0px, 0)';
        stampShadow.setAttribute('opacity', '0');

        statusText.textContent = 'STAMPED! FLYING AWAY...';

        // ---- 阶段 3: 稍作停留让用户看清印好的图标，随后被盖印的纸张优雅飞走! ----
        setTimeout(() => {
          // 当前静态印记瞬间移交给飞走纸张动画
          activeImprint.classList.remove('visible');
          launchFlyingPaper(patternData);

          // 递增已处理文件计数
          processedCount++;
          counterVal.textContent = `📄 ${processedCount}`;
          statusDot.classList.remove('active');
          statusText.textContent = 'COMPLETED! CLICK NEXT';

          // 动作完成，解除忙碌锁定
          setTimeout(() => {
            isBusy = false;
            if (isHovered) {
              statusText.textContent = 'READY TO STAMP // CLICK TO PRESS';
            } else {
              statusText.textContent = 'CLICK TO STAMP & FLY';
            }
          }, 200);

        }, 180); // 抬起后停留 180ms，确保看清纸上的图章再飞走

      }, 130); // 盖下后停顿 130ms
    }

    // 绑定点击事件到印章与纸堆热区
    stampRig.addEventListener('pointerdown', triggerStampCycle);
    paperStack.addEventListener('pointerdown', triggerStampCycle);
  </script>
</body>
